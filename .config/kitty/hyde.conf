# Este es el archivo de configuración de la terminal kitty
# Para más información ver https://sw.kovidgoyal.net/kitty/conf.html
# Para tus configuraciones personalizadas, ponlas en ./kitty.conf
#
# Administrado por HyDE (https://github.com/HyDE-Project/HyDE) — este archivo
# se regenera cada vez que cambia el tema del sistema, así que los ajustes
# personales van en kitty.conf.
font_family CaskaydiaCove Nerd Font Mono       # Nerd Font: glifos para íconos/powerline en el prompt
bold_font auto
italic_font auto
bold_italic_font auto
enable_audio_bell no
font_size 9.0
window_padding_width 25
cursor_trail 1                                 # rastro animado que sigue al cursor

# Los temas pueden sobreescribir cualquier ajuste de este archivo
include theme.conf
#background_opacity 0.60
#hide_window_decorations yes
#confirm_os_window_close 0
