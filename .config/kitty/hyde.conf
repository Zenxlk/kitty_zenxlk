# This is the configuration file for kitty terminal
# For more information, see https://sw.kovidgoyal.net/kitty/conf.html
# For your custom configurations, put it in ./kitty.conf
#
# Managed by HyDE (https://github.com/HyDE-Project/HyDE) — this file is
# regenerated whenever the system theme changes, so personal tweaks belong
# in kitty.conf instead.
font_family CaskaydiaCove Nerd Font Mono       # Nerd Font: glyphs for icons/powerline in prompts
bold_font auto
italic_font auto
bold_italic_font auto
enable_audio_bell no
font_size 9.0
window_padding_width 25
cursor_trail 1                                 # animated trail following the cursor

# Themes can override any settings in this file
include theme.conf
#background_opacity 0.60
#hide_window_decorations yes
#confirm_os_window_close 0
