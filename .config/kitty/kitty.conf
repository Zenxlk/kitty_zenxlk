# Ajustes personales, se cargan encima de hyde.conf (configuración base de HyDE).
# Mantenerlos separados permite que HyDE regenere/actualice `hyde.conf`
# sin borrar nada de lo personalizado aquí.
include hyde.conf


# workaround para https://github.com/kovidgoyal/kitty/issues/10442
# (sin esto, kitty restauraría un tamaño de ventana obsoleto en Wayland)
remember_window_size no

# Estilo minimalista de la barra de pestañas
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
# Muestra el número de ventanas solo cuando una pestaña tiene más de una
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# remapeo para abrir una pestaña nueva en el mismo directorio (por defecto es home)
# map ctrl+shift+t            new_tab_with_cwd

# Descomenta las siguientes 4 líneas para minimizar la latencia de kitty (mayor consumo)
# input_delay 0
# repaint_delay 2
# sync_to_monitor no
# wayland_enable_ime no

#: Personalizacion extra -------------------------------------------------

# Transparencia: con decoration:blur:enabled activado en Hyprland, cualquier
# ventana con opacidad < 1 recibe el blur del compositor automaticamente.
background_opacity 0.85
dynamic_background_opacity yes

# Bordes de split coloreados al dividir la ventana en paneles.
# OJO: kitty no permite referenciar "color2" etc. aqui, solo hex literal,
# asi que esto NO sigue el cambio de tema automaticamente (ver nota en el
# repo sobre como hacerlo realmente dinamico via wallbash si se necesita).
active_border_color #FADA16
inactive_border_color #1F2229

# Cursor mas vivo: beam fino con parpadeo suave
cursor_shape beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
