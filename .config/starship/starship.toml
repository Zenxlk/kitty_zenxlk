"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# Prompt en bloques estilo "powerline". Los colores usan nombres ANSI
# (blue/bright-black/black/green) en vez de hex, para seguir el esquema
# dinamico que kitty ya aplica (theme.conf, sincronizado con el wallpaper).
#
# Cada modulo lleva su propia flecha de entrada en su "format"; asi, cuando
# un modulo condicional (como la rama de git) no aplica, desaparece junto
# con su flecha en vez de dejar un hueco o una flecha huerfana.
format = """
[](fg:blue)[  $username ](bg:blue fg:black)$directory$git_branch$time[](fg:black) $cmd_duration
$character"""

[username]
show_always = true
format = "[$user]($style)"
style_user = "bg:blue fg:black"
style_root = "bg:red fg:black"

[directory]
format = "[](fg:blue bg:bright-black)[  $path ](bg:bright-black fg:white)"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

# Rama actual (y estado: cambios sin commitear, ahead/behind) solo se
# muestra dentro de un repositorio git.
[git_branch]
symbol = ""
format = "[](fg:bright-black bg:green)[ $symbol $branch ](bg:green fg:black)"

[git_status]
format = "[ $all_status$ahead_behind](bg:green fg:black)"

[time]
disabled = false
time_format = "%I:%M %p"
format = "[](fg:bright-black bg:black)[  $time ](bg:black fg:white)"

# Ejemplo adicional: muestra cuanto tardo el ultimo comando si fue "lento".
[cmd_duration]
min_time = 2_000
format = "tomo [$duration](yellow) "

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
