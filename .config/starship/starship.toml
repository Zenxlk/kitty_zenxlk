"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# Prompt en "pildoras" separadas (cada segmento con su propio borde
# redondeado), en vez de una barra continua estilo powerline. Los colores
# usan nombres ANSI (blue/bright-black/black/green) en vez de hex, para
# seguir el esquema dinamico que kitty ya aplica (theme.conf, sincronizado
# con el wallpaper).
format = """
[](fg:blue)[  $username ](bg:blue fg:black)[]( fg:blue) $directory$git_branch$time $cmd_duration
$character"""

[username]
show_always = true
format = "[$user]($style)"
style_user = "bg:blue fg:black"
style_root = "bg:red fg:black"

[directory]
format = "[](fg:bright-black)[  $path ](bg:bright-black fg:white)[]( fg:bright-black)"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

# Rama actual (y estado: cambios sin commitear, ahead/behind) solo se
# muestra dentro de un repositorio git.
[git_branch]
symbol = ""
format = "[](fg:green)[ $symbol $branch ](bg:green fg:black)[]( fg:green)"

[git_status]
format = "[ $all_status$ahead_behind](bg:green fg:black)"

[time]
disabled = false
time_format = "%I:%M %p"
format = "[](fg:black)[  $time ](bg:black fg:white)[]( fg:black)"

# Ejemplo adicional: muestra cuanto tardo el ultimo comando si fue "lento".
[cmd_duration]
min_time = 2_000
format = "tomo [$duration](yellow) "

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
